# VPS monitoring stack: host metrics, per-container metrics, dashboards,
# alerting and uptime checks.
#
# Security note: every UI is bound to 127.0.0.1 on purpose. Reach them through
# an SSH tunnel or put them behind your existing reverse proxy with auth.
# Never expose Prometheus, cAdvisor or Alertmanager directly to the internet.

name: monitoring

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [monitoring]

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks: [monitoring]

  # Host-level metrics: CPU, RAM, disk, network, load, filesystems.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run/credentials)($$|/)
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]

  # Per-container metrics: CPU, memory and network for every container on the
  # host, read from the Docker API.
  #
  # This is NOT cAdvisor. cAdvisor reads Docker's on-disk layer database and
  # is broken on Docker 29: the containerd image store dropped the legacy
  # image/<driver>/layerdb layout, so cAdvisor fails to create every container
  # and reports only the root cgroup -- empty dashboards, dead alerts, and no
  # error anywhere except its own logs.
  telegraf:
    image: telegraf:1.32
    container_name: telegraf
    restart: unless-stopped
    # Read-only socket access. The container runs as the unprivileged telegraf
    # user, so it needs the host's docker group to open the socket at all.
    # DOCKER_GID comes from .env: `stat -c %g /var/run/docker.sock`.
    group_add:
      - ${DOCKER_GID:?run "stat -c %g /var/run/docker.sock" and set DOCKER_GID in .env}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [monitoring]

  grafana:
    image: grafana/grafana:11.5.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      # Pre-installed panels used by the community dashboards below.
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    networks: [monitoring]

  # Black-box uptime checks per service, with its own alerting and status page.
  # Kept separate from Prometheus on purpose: it answers "is it down?" without
  # any PromQL, which is the question you ask at 3am.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    # Also on Kamal's network so it can reach kamal-proxy and the app
    # containers directly, without going out to the public internet and back.
    networks: [monitoring, kamal]

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  uptime_kuma_data:

networks:
  monitoring:
    name: monitoring
  # Created by Kamal on first deploy; this stack only joins it.
  kamal:
    external: true
