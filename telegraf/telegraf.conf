# Per-container metrics via the Docker API.
#
# This replaces cAdvisor, which reads Docker's on-disk layer database and
# breaks on Docker 29: the containerd image store dropped the legacy
# image/<driver>/layerdb layout cAdvisor depends on, so it fails to create
# every container and reports only the root cgroup. The API is stable across
# storage drivers.

[agent]
  interval = "15s"
  flush_interval = "15s"
  omit_hostname = true

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  # Only the labels worth keeping. Kamal sets service and role on every
  # container it manages, which is a far more stable identity than the
  # container name (that one carries the git SHA and changes on every deploy).
  docker_label_include = ["service", "role"]

  # perdevice=false drops the per-interface and per-block-device breakdown;
  # total=true keeps one aggregated series per container instead. That is the
  # combination that yields network="total" and device="total": with both set
  # to false, Telegraf emits no network or blkio series at all, which is how
  # this stack spent its first weeks with no per-container network or disk I/O
  # whatsoever.
  #
  # Telegraf warns that both are deprecated in favour of perdevice_include and
  # total_include, and will drop them in 1.35. Do not migrate blindly: on
  # 1.32.3 neither `perdevice_include = []` nor `perdevice_include = ["cpu"]`
  # suppresses anything -- both still emit network="eth0" and device="253:0",
  # one series per interface and per block device. Only the deprecated pair
  # below actually works. Recheck when bumping the image tag.
  perdevice = false
  total = true

  # container_id is a FIELD here, not a tag -- and prometheus_client with
  # metric_version=2 turns string fields into labels. That is why the
  # `tagexclude` this replaces never removed anything.
  fieldexclude = ["container_id"]
  # For Kamal-managed containers this is the git SHA, the same churning
  # identity the `unit` label exists to avoid.
  tagexclude = ["container_version"]

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
