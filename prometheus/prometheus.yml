# Scrape config for the VPS. Add one job per service that exposes /metrics.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    vps: main   # rename if you ever add a second server

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host: CPU, RAM, disk, network.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: vps

  # Every container on the host, read from the Docker API by Telegraf.
  - job_name: docker
    static_configs:
      - targets: ["telegraf:9273"]
    metric_relabel_configs:
      # Build a `unit` label that survives a deploy.
      #
      # Kamal stamps service=<service> and role=<web|job> on every container it
      # manages, and those labels are stable; the container name is not, since
      # it carries the git SHA and changes on every deploy. Alerts key on
      # `unit`, never on container_name.
      #
      #   app-web-4fbed717...   service=app, role=web   -> unit="app-web"
      #   app-db                service=app-db          -> unit="app-db"
      #   prometheus            (no Kamal labels)       -> unit="prometheus"
      - source_labels: [service, role]
        regex: '(.+);(.+)'
        target_label: unit
        replacement: '${1}-${2}'
      # Kamal accessories carry service but no role.
      - source_labels: [unit, service]
        regex: ';(.+)'
        target_label: unit
        replacement: '${1}'
      # Everything else (this stack, kamal-proxy) keeps its container name.
      - source_labels: [unit, container_name]
        regex: ';(.+)'
        target_label: unit
        replacement: '${1}'

  # --- Application metrics -------------------------------------------------
  # Uncomment and adapt one block per service that exposes a /metrics endpoint.
  # The target must be reachable from the `monitoring` network: either attach
  # the service's container to it, or use host.docker.internal / the host IP.
  #
  # - job_name: service-a
  #   static_configs:
  #     - targets: ["service-a:9091"]
  #
  # - job_name: service-b
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["service-b:3000"]
