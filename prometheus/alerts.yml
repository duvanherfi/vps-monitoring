# Alert rules. Thresholds are deliberately conservative: an alert that fires
# every week gets muted, and a muted alert is worse than no alert.

groups:
  - name: deadmanswitch
    rules:
      # Always firing. Routed to an external service (Healthchecks.io) which
      # alerts when the pings STOP -- that is what catches the VPS dying,
      # Prometheus crashing, or the network going away.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none

  - name: host
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The host stopped reporting metrics"
          description: "node-exporter has been unreachable for 2 minutes."

      - alert: HostHighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU above 85% for 15 minutes"
          description: "Current usage: {{ printf \"%.0f\" $value }}%."

      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory above 90%"
          description: "Available memory is under 10% of total."

      - alert: HostDiskFillingUp
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
               / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} is {{ printf \"%.0f\" $value }}% full"

      - alert: HostDiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24*3600) < 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} will run out of space within 24h"
          description: "Based on the last 6 hours of growth."

      - alert: HostSwapping
        expr: (1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes) * 100 > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Swap usage above 50%"

  - name: containers
    rules:
      # Telegraf only reports RUNNING containers, so a stopped one does not go
      # stale -- its series vanishes outright. `time() - something` can never
      # fire for it, because there is nothing left to subtract from. The only
      # way to catch a disappearance is to compare what existed recently
      # against what exists now.
      #
      # Keyed on `unit` (derived from Kamal's own service/role labels), never
      # on container_name: a deploy swaps app-web-<oldsha> for app-web-<newsha>
      # and both carry unit="app-web", so this stays quiet while shipping.
      - alert: UnitHasNoContainer
        expr: |
          count by (unit) (max_over_time(docker_container_status_uptime_ns[2h]))
            unless
          count by (unit) (docker_container_status_uptime_ns)
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.unit }} has no running container"
          description: "It was running within the last 2 hours and now has none at all."

      # Kamal deploys start a fresh container whose restart_count is 0, so
      # shipping never trips this. Only a container Docker keeps restarting in
      # place does.
      - alert: ContainerRestartLoop
        expr: |
          increase(docker_container_status_restart_count[15m]) > 3
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.unit }} is restarting in a loop"
          description: "{{ $value }} restarts in the last 15 minutes ({{ $labels.container_name }})."

      # The clearest signal there is that a container ran out of memory.
      - alert: ContainerOOMKilled
        expr: docker_container_status_oomkilled > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.unit }} was killed by the OOM killer"
          description: "The kernel reclaimed it. Either it leaked or its limit is too low."

      # Note: with no `memory` limit set in Kamal, Docker reports the host's
      # total as the limit, so this compares against the whole machine. That is
      # still the number that matters on a single-service-per-container VPS.
      - alert: ContainerHighMemory
        expr: docker_container_mem_usage_percent > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.unit }} is using {{ printf \"%.0f\" $value }}% of available memory"

      - alert: ContainerHighCPU
        expr: docker_container_cpu_usage_percent > 90
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.unit }} sustained above 90% of one CPU"

  - name: scraping
    rules:
      # Catches an application whose /metrics endpoint went away, which usually
      # means the app is up but broken.
      - alert: TargetDown
        expr: up{job!~"node|prometheus"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})"
