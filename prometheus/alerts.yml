# Alert rules. Thresholds are deliberately conservative: an alert that fires
# every week gets muted, and a muted alert is worse than no alert.

groups:
  - name: deadmanswitch
    rules:
      # Always firing. Routed to an external service (Healthchecks.io) which
      # alerts when the pings STOP -- that is what catches the VPS dying,
      # Prometheus crashing, or the network going away.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none

  - name: host
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The host stopped reporting metrics"
          description: "node-exporter has been unreachable for 2 minutes."

      - alert: HostHighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU above 85% for 15 minutes"
          description: "Current usage: {{ printf \"%.0f\" $value }}%."

      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory above 90%"
          description: "Available memory is under 10% of total."

      - alert: HostDiskFillingUp
        expr: |
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
               / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} is {{ printf \"%.0f\" $value }}% full"

      - alert: HostDiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}[6h], 24*3600) < 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} will run out of space within 24h"
          description: "Based on the last 6 hours of growth."

      - alert: HostSwapping
        expr: (1 - node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes) * 100 > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Swap usage above 50%"

  - name: containers
    rules:
      # A stopped container does not go stale in cAdvisor, its series vanishes
      # outright -- so `time() - container_last_seen > N` can never fire: there
      # is nothing left to subtract from. The only way to catch a disappearance
      # is to compare what existed recently against what exists now.
      #
      # Keyed on the Kamal-stable `service` label, never on the container name:
      # a deploy replaces app-web-<oldsha> with app-web-<newsha> and both carry
      # service="app-web", so the service is never absent and this stays quiet.
      - alert: ServiceHasNoContainer
        expr: |
          count by (service) (max_over_time(container_last_seen{service!=""}[2h]))
            unless
          count by (service) (container_last_seen{service!=""})
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.service }} has no running container"
          description: "It was running within the last 2 hours and now has no container at all. Kamal overlaps old and new containers during a deploy, so this is a real outage."

      # Still keyed on name: a Kamal deploy creates a brand new series rather
      # than restarting an existing one, so shipping does not trigger this.
      - alert: ContainerRestartLoop
        expr: |
          changes(container_start_time_seconds{name!=""}[15m]) > 3
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} is restarting in a loop"
          description: "{{ $value }} restarts in the last 15 minutes."

      - alert: ContainerHighMemory
        expr: |
          container_memory_working_set_bytes{service!=""}
            / (container_spec_memory_limit_bytes{service!=""} != 0) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} is near its memory limit"
          description: "Using {{ printf \"%.0f\" $value }}% of its limit; the OOM killer is next."

      - alert: ContainerHighCPU
        expr: |
          sum by (service) (rate(container_cpu_usage_seconds_total{service!=""}[5m])) * 100 > 90
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} sustained above 90% of one CPU"

  - name: scraping
    rules:
      # Catches an application whose /metrics endpoint went away, which usually
      # means the app is up but broken.
      - alert: TargetDown
        expr: up{job!~"node|prometheus"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})"
